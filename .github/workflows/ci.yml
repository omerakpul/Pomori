name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pomori-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # main'e her push'ta güncel debug APK'yı herkese açık bir ön sürüme koyar (hızlı test için).
      - name: Publish latest debug APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug (latest main)
          prerelease: true
          body: Her main push'unda güncellenen debug derlemesi. Test içindir, imzalı sürüm değildir.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
